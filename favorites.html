<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Избранное</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f5f5f5; }
        .header {
            background: #333;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }
        .header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .favorite-card {
            background: white;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .favorite-card h3 { margin-bottom: 10px; }
        .price { color: #e44d26; font-size: 1.2rem; font-weight: bold; }
        .date { color: #999; font-size: 0.8rem; margin: 10px 0; }
        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 3px;
            cursor: pointer;
            width: 100%;
        }
        .actions { margin: 20px 0; }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 10px;
        }
        .clear-btn { background: #dc3545; }
        #favoritesCount {
            background: #e44d26;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>❤️ Избранное</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="products.html">Товары</a>
            <a href="favorites.html">Избранное <span id="favoritesCount">0</span></a>
        </nav>
    </div>
    
    <div class="container">
        <div class="actions">
            <button onclick="window.location.href='products.html'">← Продолжить покупки</button>
            <button class="clear-btn" onclick="clearAllFavorites()">Очистить всё</button>
        </div>
        
        <div id="favorites-grid" class="favorites-grid">Загрузка...</div>
    </div>
    
    <script>
        loadFavorites();
        
        async function loadFavorites() {
            try {
                const response = await fetch('/api/favorites');
                const favorites = await response.json();
                displayFavorites(favorites);
                updateCount(favorites);
            } catch (error) {
                document.getElementById('favorites-grid').innerHTML = 
                    '<p style="color:red">Ошибка загрузки. Проверьте сервер.</p>';
            }
        }
        
        function displayFavorites(favorites) {
            const container = document.getElementById('favorites-grid');
            
            if (!favorites || favorites.length === 0) {
                container.innerHTML = '<p>В избранном пока пусто</p>';
                return;
            }
            
            let html = '';
            favorites.forEach(item => {
                html += `
                    <div class="favorite-card" data-id="${item.id}">
                        <h3>${item.product_name}</h3>
                        <div class="price">$${item.product_price}</div>
                        <div class="date">${new Date(item.added_at).toLocaleString()}</div>
                        <button class="remove-btn" onclick="removeFromFavorites(${item.id})">Удалить</button>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        async function removeFromFavorites(id) {
            try {
                const response = await fetch(`/api/favorites/remove/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                displayFavorites(data.favorites);
                updateCount(data.favorites);
            } catch (error) {
                alert('Ошибка удаления');
            }
        }
        
        async function clearAllFavorites() {
            if (!confirm('Очистить всё?')) return;
            
            try {
                const response = await fetch('/api/favorites/clear', {
                    method: 'DELETE'
                });
                const data = await response.json();
                displayFavorites([]);
                updateCount([]);
            } catch (error) {
                alert('Ошибка очистки');
            }
        }
        
        function updateCount(favorites) {
            const count = favorites ? favorites.length : 0;
            document.getElementById('favoritesCount').textContent = count;
        }
    </script>
</body>
</html>
